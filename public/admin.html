<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таза · Админ</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">Таза</span><span class="sub">Админ-панель</span></div>
    <div class="whoami"><span id="whoName"></span><span class="logout-link" onclick="logout()">Выйти</span></div>
  </header>

  <nav class="tabs">
    <button data-tab="new" class="active">Новый звонок</button>
    <button data-tab="list">Договоры</button>
    <button data-tab="clients">Карта клиента</button>
    <button data-tab="cash">Касса</button>
    <button data-tab="staff">Сотрудники</button>
  </nav>

  <!-- НОВЫЙ ДОГОВОР -->
  <section id="view-new">
    <div class="card">
      <h1 class="formtitle">Новый договор</h1>
      <p class="formhint">Заполните данные во время звонка клиента</p>

      <div class="field required"><label>Телефон клиента</label><input id="f_phone" type="tel" placeholder="+7 700 000 00 00"></div>
      <div class="field"><label>Имя клиента</label><input id="f_name" type="text" placeholder="Например, Анара"></div>

      <div class="field required">
        <label>Город / район</label>
        <select id="f_city">
          <option value="">Выберите город</option>
          <option>Есиль</option><option>Алматы</option><option>Байконур</option>
          <option>Нура</option><option>Сарыарка</option><option>Основной цех</option><option>Пригород</option>
          <option value="__other">Другой...</option>
        </select>
        <input id="f_city_other" type="text" placeholder="Введите город" style="margin-top:8px;display:none;">
      </div>

      <div class="field required"><label>Адрес</label><input id="f_addr" type="text" placeholder="Улица, дом"></div>

      <div class="grid2">
        <div class="field"><label>Подъезд</label><input id="f_entrance" type="text"></div>
        <div class="field"><label>Этаж</label><input id="f_floor" type="number"></div>
      </div>
      <div class="field"><label>Кв.</label><input id="f_apt" type="text" placeholder="напр. 24"></div>

      <div class="field required">
        <label>Ковры (укажите м² каждого коврика)</label>
        <div id="carpetsList"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="addCarpetBtn" style="margin-top:4px;width:auto;padding:8px 14px;">+ Добавить ковёр</button>
      </div>
      <div class="cost-row" style="margin-bottom:18px;">
        <span class="label">Ковров: <b id="carpetsCountLabel">1</b> · Общая площадь</span>
        <span class="value" id="totalAreaLabel">0 м²</span>
      </div>

      <div class="grid2">
        <div class="field required"><label>Дата</label><input id="f_date" type="date"></div>
        <div class="field"><label>Статус</label>
          <select id="f_status">
            <option value="new_call">Новый звонок</option>
            <option value="pickup">Забор ковров</option>
            <option value="wash">Стирка</option>
            <option value="delivery">Доставка</option>
            <option value="closed">Закрыто</option>
          </select>
        </div>
      </div>

      <div class="field"><label>Курьер (если готово к забору/доставке)</label>
        <select id="f_courier"><option value="">Не назначен</option></select>
      </div>

      <div class="grid2">
        <div class="field"><label>Цена обычный, ₸/м²</label><input id="f_price_normal" type="number" value="900"></div>
        <div class="field"><label>Цена с запахом, ₸/м²</label><input id="f_price_smell" type="number" value="1200"></div>
      </div>

      <div class="field">
        <label>Скидка</label>
        <select id="f_discount">
          <option value="none">Без скидки</option>
          <option value="pension">Пенсионная — 10%</option>
          <option value="promo3plus1">Акция 3+1 (каждый 4-й ковёр бесплатно)</option>
        </select>
      </div>

      <div class="cost-row" id="discountRow" style="margin-bottom:18px;display:none;">
        <span class="label">Скидка</span>
        <span class="value" id="discountAmountLabel">0 ₸</span>
      </div>

      <div class="field required"><label>Стоимость, ₸</label><input id="f_cost" type="number"></div>

      <div class="field"><label>Комментарий</label><textarea id="f_comment"></textarea></div>

      <button class="btn btn-primary" id="saveBtn">Сохранить договор</button>
    </div>
  </section>

  <!-- СПИСОК ДОГОВОРОВ -->
  <section id="view-list" style="display:none;">
    <div id="statusChips" class="city-chips"></div>
    <div id="cityChips" class="city-chips"></div>
    <div class="search"><input id="searchInput" type="text" placeholder="Поиск по телефону, адресу, имени"></div>
    <div id="listContainer"></div>
  </section>

  <!-- КАРТА КЛИЕНТА -->
  <section id="view-clients" style="display:none;">
    <div class="search"><input id="clientSearch" type="text" placeholder="Поиск клиента по телефону или имени"></div>
    <div id="clientsContainer"></div>
  </section>

  <!-- КАССА -->
  <section id="view-cash" style="display:none;">
    <div id="cashStats"></div>
  </section>

  <!-- СОТРУДНИКИ -->
  <section id="view-staff" style="display:none;">
    <div class="card" style="margin-bottom:14px;">
      <h1 class="formtitle">Добавить сотрудника</h1>
      <div class="grid2">
        <div class="field"><label>Имя</label><input id="s_name" type="text"></div>
        <div class="field"><label>Роль</label>
          <select id="s_role"><option value="courier">Курьер</option><option value="admin">Админ</option></select>
        </div>
      </div>
      <div class="field"><label>Email (логин)</label><input id="s_email" type="email"></div>
      <div class="field"><label>Пароль</label><input id="s_password" type="text" placeholder="минимум 6 символов"></div>
      <div class="field"><label>Телефон</label><input id="s_phone" type="tel"></div>
      <button class="btn btn-primary" id="addStaffBtn">Создать учётку</button>
    </div>
    <div id="staffContainer"></div>
  </section>
</div>

<div id="detailOverlay" class="overlay" style="display:none;"></div>

<script src="/common.js"></script>
<script>
let contracts = [];
let couriers = [];
let activeCityFilter = null;
let activeStatusFilter = null;

async function init(){
  const me = await whoAmI();
  if(!me) return;
  if(me.role !== 'admin'){ window.location.href = '/courier.html'; return; }
  document.getElementById('whoName').textContent = me.full_name;
  document.getElementById('f_date').value = new Date().toISOString().slice(0,10);

  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });

  document.getElementById('f_city').addEventListener('change', e=>{
    document.getElementById('f_city_other').style.display = e.target.value==='__other' ? 'block':'none';
  });

  await loadStaff();
  await loadContracts();
  wireForm();
  wireStaffForm();
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('clientSearch').addEventListener('input', ()=>loadClients());
}

function switchTab(tab){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ['new','list','clients','cash','staff'].forEach(t=>{
    document.getElementById('view-'+t).style.display = (t===tab)?'block':'none';
  });
  if(tab==='list') renderList();
  if(tab==='clients') loadClients();
  if(tab==='cash') loadCash();
  if(tab==='staff') renderStaff();
}

// ---------- Contracts: create ----------
function getCityValue(){
  const sel = document.getElementById('f_city');
  return sel.value==='__other' ? document.getElementById('f_city_other').value.trim() : sel.value;
}

function wireForm(){
  const carpetsList = document.getElementById('carpetsList');
  const priceNormal = document.getElementById('f_price_normal');
  const priceSmell = document.getElementById('f_price_smell');
  const discountSelect = document.getElementById('f_discount');
  const cost = document.getElementById('f_cost');
  let manual = false;
  cost.addEventListener('input', ()=>manual=true);

  function carpetRow(value, type){
    const row = document.createElement('div');
    row.className = 'carpet-row';
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;';
    row.innerHTML = `
      <span style="min-width:78px;color:var(--muted);font-size:13px;" data-carpet-label></span>
      <input type="number" step="0.01" min="0" class="carpet-area" placeholder="м²" style="flex:1;min-width:80px;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;">
      <select class="carpet-type" style="flex:1;min-width:140px;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;">
        <option value="normal">Обычный</option>
        <option value="smell">С сильным запахом</option>
      </select>
      <button type="button" class="btn btn-ghost btn-sm" data-remove-carpet style="width:auto;padding:8px 12px;">✕</button>`;
    if(value!==undefined) row.querySelector('.carpet-area').value = value;
    if(type) row.querySelector('.carpet-type').value = type;
    row.querySelector('.carpet-area').addEventListener('input', recalc);
    row.querySelector('.carpet-type').addEventListener('change', recalc);
    row.querySelector('[data-remove-carpet]').addEventListener('click', ()=>{
      if(carpetsList.children.length <= 1) return; // всегда минимум один ковёр
      row.remove();
      renumberCarpets();
      recalc();
    });
    return row;
  }
  function addCarpetRow(value, type){
    carpetsList.appendChild(carpetRow(value, type));
    renumberCarpets();
    recalc();
  }
  function renumberCarpets(){
    [...carpetsList.children].forEach((row, i)=>{
      row.querySelector('[data-carpet-label]').textContent = `Ковёр ${i+1}`;
    });
  }
  function resetCarpets(){
    carpetsList.innerHTML = '';
    addCarpetRow();
  }
  function getCarpets(){
    return [...carpetsList.children].map(row=>({
      area: parseFloat(row.querySelector('.carpet-area').value),
      type: row.querySelector('.carpet-type').value
    })).filter(c=>!isNaN(c.area) && c.area>0);
  }
  // Возвращает { rawTotal, finalTotal, discountAmount, discountLabel }
  function computeCost(){
    const carpetsData = getCarpets();
    const pn = parseFloat(priceNormal.value) || 0;
    const ps = parseFloat(priceSmell.value) || 0;
    const itemCosts = carpetsData.map(c => c.area * (c.type==='smell' ? ps : pn));
    const rawTotal = itemCosts.reduce((s,v)=>s+v, 0);
    const discount = discountSelect.value;
    let finalTotal = rawTotal, discountAmount = 0, discountLabel = '';

    if(discount === 'pension'){
      discountAmount = rawTotal * 0.10;
      finalTotal = rawTotal - discountAmount;
      discountLabel = 'Пенсионная скидка 10%';
    } else if(discount === 'promo3plus1'){
      const n = itemCosts.length;
      const freeCount = Math.floor(n / 4);
      if(freeCount > 0){
        const sorted = [...itemCosts].sort((a,b)=>a-b); // бесплатным идёт самый дешёвый ковёр
        discountAmount = sorted.slice(0, freeCount).reduce((s,v)=>s+v, 0);
        finalTotal = rawTotal - discountAmount;
        discountLabel = `Акция 3+1: бесплатно ${freeCount} ковёр(ов)`;
      }
    }
    return { totalArea: carpetsData.reduce((s,c)=>s+c.area,0), rawTotal, finalTotal, discountAmount, discountLabel };
  }
  function recalc(){
    const r = computeCost();
    document.getElementById('carpetsCountLabel').textContent = carpetsList.children.length;
    document.getElementById('totalAreaLabel').textContent = r.totalArea.toFixed(2).replace(/\.00$/,'') + ' м²';
    const discountRow = document.getElementById('discountRow');
    if(r.discountAmount > 0){
      discountRow.style.display = 'flex';
      document.getElementById('discountAmountLabel').textContent = '−' + fmtMoney(Math.round(r.discountAmount));
    } else {
      discountRow.style.display = 'none';
    }
    if(r.totalArea>0 && !manual) cost.value = Math.round(r.finalTotal);
  }

  document.getElementById('addCarpetBtn').addEventListener('click', ()=>addCarpetRow());
  priceNormal.addEventListener('input', recalc);
  priceSmell.addEventListener('input', recalc);
  discountSelect.addEventListener('change', recalc);
  resetCarpets();

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const phone = document.getElementById('f_phone').value.trim();
    const city = getCityValue();
    const addr = document.getElementById('f_addr').value.trim();
    const carpetsData = getCarpets();
    const qty = carpetsList.children.length;
    const r = computeCost();
    const date = document.getElementById('f_date').value;
    const costVal = document.getElementById('f_cost').value;
    if(!phone||!city||!addr||!qty||!date||!costVal){ showToast('Заполните обязательные поля (*)'); return; }

    const hasSmell = carpetsData.some(c=>c.type==='smell');
    const commentParts = [document.getElementById('f_comment').value.trim()];
    if(hasSmell) commentParts.unshift('С сильным запахом: ' + carpetsData.filter(c=>c.type==='smell').map(c=>c.area+'м²').join(', '));
    if(r.discountLabel) commentParts.unshift(r.discountLabel);

    try{
      await api('/api/contracts', {method:'POST', body: JSON.stringify({
        phone, client_name: document.getElementById('f_name').value.trim(),
        city, address: addr,
        apartment: document.getElementById('f_apt').value,
        entrance: document.getElementById('f_entrance').value,
        floor: document.getElementById('f_floor').value,
        qty_carpets: qty, area: r.totalArea || null,
        price_per_m2: priceNormal.value || null, cost: costVal,
        status: document.getElementById('f_status').value,
        assigned_courier_id: document.getElementById('f_courier').value || null,
        contract_date: date, comment: commentParts.filter(Boolean).join(' | ')
      })});
      showToast('Договор сохранён');
      ['f_phone','f_name','f_addr','f_entrance','f_floor','f_apt','f_cost','f_comment','f_city_other']
        .forEach(id=>document.getElementById(id).value='');
      document.getElementById('f_city').value='';
      document.getElementById('f_city_other').style.display='none';
      document.getElementById('f_status').value='new_call';
      document.getElementById('f_courier').value='';
      document.getElementById('f_discount').value='none';
      document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
      manual=false;
      resetCarpets();
      await loadContracts();
      switchTab('list');
    }catch(e){ showToast(e.message); }
  });
}

// ---------- Contracts: list ----------
async function loadContracts(){
  try{ contracts = await api('/api/contracts'); renderList(); }
  catch(e){ showToast(e.message); }
}

function renderCityChips(){
  const el = document.getElementById('cityChips');
  const counts = {};
  contracts.forEach(c=>{ const city=c.city||'Без города'; counts[city]=(counts[city]||0)+1; });
  const cities = Object.keys(counts).sort();
  if(cities.length===0){ el.innerHTML=''; return; }
  el.innerHTML = `<button class="chip ${!activeCityFilter?'active':''}" data-city="">Все (${contracts.length})</button>` +
    cities.map(c=>`<button class="chip ${activeCityFilter===c?'active':''}" data-city="${escapeHtml(c)}">${escapeHtml(c)} (${counts[c]})</button>`).join('');
  el.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeCityFilter = chip.dataset.city || null; renderList(); });
  });
}

function renderStatusChips(){
  const el = document.getElementById('statusChips');
  const counts = {};
  contracts.forEach(c=>{ counts[c.status] = (counts[c.status]||0)+1; });
  el.innerHTML = `<button class="chip ${!activeStatusFilter?'active':''}" data-status="">Все статусы (${contracts.length})</button>` +
    Object.entries(STATUS_META).map(([k,v])=>
      `<button class="chip ${activeStatusFilter===k?'active':''}" data-status="${k}" style="${activeStatusFilter===k?`background:${v.color};border-color:${v.color};`:''}">${v.label} (${counts[k]||0})</button>`
    ).join('');
  el.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeStatusFilter = chip.dataset.status || null; renderList(); });
  });
}

function renderList(){
  renderStatusChips();
  renderCityChips();
  const container = document.getElementById('listContainer');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = contracts.filter(c=>{
    const matchesStatus = !activeStatusFilter || c.status===activeStatusFilter;
    const matchesCity = !activeCityFilter || (c.city||'Без города')===activeCityFilter;
    const matchesQ = !q || (c.client_phone||'').toLowerCase().includes(q) ||
      (c.address||'').toLowerCase().includes(q) || (c.client_name||'').toLowerCase().includes(q);
    return matchesStatus && matchesCity && matchesQ;
  });
  if(filtered.length===0){
    container.innerHTML = `<div class="empty"><div class="big">🧺</div><div class="t">${contracts.length===0?'Пока нет договоров':'Ничего не найдено'}</div></div>`;
    return;
  }
  container.innerHTML = `<div class="list">${filtered.map(cardHtml).join('')}</div>`;
  container.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click', ()=>openDetail(el.dataset.id)));
}

function cardHtml(c){
  const meta = STATUS_META[c.status]||STATUS_META.new_call;
  const loc = [c.entrance?`под. ${c.entrance}`:null, c.floor?`эт. ${c.floor}`:null, c.apartment?`кв. ${c.apartment}`:null].filter(Boolean).join(', ');
  return `<div class="item" data-id="${c.id}">
    <div class="row1">
      <div><div class="phone">№${c.id} · ${escapeHtml(c.client_phone||'—')}</div>
      <div class="addr">${c.city?escapeHtml(c.city)+' · ':''}${escapeHtml(c.address)}${loc?' · '+loc:''}</div></div>
      <span class="badge" style="background:${meta.color}">${meta.label}</span>
    </div>
    <div class="row2"><span>Ковров: <b>${escapeHtml(c.qty_carpets||'—')}</b></span>
      ${c.courier_name?`<span>Курьер: <b>${escapeHtml(c.courier_name)}</b></span>`:''}</div>
    <div class="row3"><span class="cost">${fmtMoney(c.cost)}</span><span class="date">${fmtDate(c.contract_date)}</span></div>
  </div>`;
}

function openDetail(id){
  const c = contracts.find(x=>String(x.id)===String(id));
  if(!c) return;
  const overlay = document.getElementById('detailOverlay');
  overlay.style.display='flex';
  const cityOptions = ['Есиль','Алматы','Байконур','Нура','Сарыарка','Основной цех','Пригород'];
  const isKnownCity = cityOptions.includes(c.city);
  overlay.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h2>№${c.id} · ${escapeHtml(c.client_phone)}</h2><button class="close-x" id="closeDetail">✕</button></div>

    <div class="field"><label>Город / район</label>
      <select id="editCity">
        <option value="">Выберите город</option>
        ${cityOptions.map(city=>`<option value="${city}" ${c.city===city?'selected':''}>${city}</option>`).join('')}
        <option value="__other" ${!isKnownCity && c.city ? 'selected':''}>Другой...</option>
      </select>
      <input id="editCityOther" type="text" placeholder="Введите город" value="${!isKnownCity ? escapeHtml(c.city||'') : ''}" style="margin-top:8px;${!isKnownCity && c.city ? '':'display:none;'}">
    </div>
    <div class="field"><label>Адрес</label><input id="editAddr" type="text" value="${escapeHtml(c.address||'')}"></div>
    <div class="grid2">
      <div class="field"><label>Подъезд</label><input id="editEntrance" type="text" value="${escapeHtml(c.entrance||'')}"></div>
      <div class="field"><label>Этаж</label><input id="editFloor" type="number" value="${escapeHtml(c.floor||'')}"></div>
    </div>
    <div class="field"><label>Кв.</label><input id="editApt" type="text" value="${escapeHtml(c.apartment||'')}"></div>

    <div class="field">
      <label>Ковры (м² каждого коврика)</label>
      <div id="editCarpetsList"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="editAddCarpetBtn" style="margin-top:4px;width:auto;padding:8px 14px;">+ Добавить ковёр</button>
    </div>
    <div class="cost-row" style="margin-bottom:14px;">
      <span class="label">Ковров: <b id="editCarpetsCountLabel">${c.qty_carpets||1}</b> · Общая площадь</span>
      <span class="value" id="editTotalAreaLabel">${c.area||0} м²</span>
    </div>
    <div class="grid2">
      <div class="field"><label>Цена обычный, ₸/м²</label><input id="editPriceNormal" type="number" value="${c.price_per_m2||900}"></div>
      <div class="field"><label>Цена с запахом, ₸/м²</label><input id="editPriceSmell" type="number" value="1200"></div>
    </div>
    <p class="formhint" style="margin-top:-8px;">Изменение ковров/цен пересчитает стоимость ниже (если она не была изменена вручную).</p>

    <div class="field"><label>Статус</label>
      <select id="editStatus">${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${k===c.status?'selected':''}>${v.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Курьер</label>
      <select id="editCourier"><option value="">Не назначен</option>
        ${couriers.map(u=>`<option value="${u.id}" ${u.id===c.assigned_courier_id?'selected':''}>${escapeHtml(u.full_name)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Стоимость, ₸</label><input id="editCost" type="number" value="${c.cost}"></div>
    <div class="field">
      <label>Скидка (применяется к текущей сумме выше)</label>
      <div style="display:flex;gap:8px;">
        <select id="editDiscount" style="flex:1;">
          <option value="none">Выбрать скидку...</option>
          <option value="pension">Пенсионная — 10%</option>
          <option value="promo3plus1">Акция 3+1 (по кол-ву ковров: ${c.qty_carpets||1})</option>
        </select>
        <button type="button" class="btn btn-ghost btn-sm" id="applyDiscountBtn" style="width:auto;padding:11px 16px;">Применить</button>
      </div>
      <p class="formhint" style="margin:6px 0 0;">Применяйте один раз — повторное применение посчитает скидку от уже сниженной суммы.</p>
    </div>
    <div class="field"><label>Комментарий</label><textarea id="editComment">${escapeHtml(c.comment||'')}</textarea></div>
    <button class="btn btn-primary" id="saveDetailBtn" style="margin-bottom:10px;">Сохранить изменения</button>
    <button class="btn btn-ghost" id="deleteBtn">Удалить договор</button>
  </div>`;
  document.getElementById('closeDetail').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetail(); });

  document.getElementById('editCity').addEventListener('change', e=>{
    document.getElementById('editCityOther').style.display = e.target.value==='__other' ? 'block':'none';
  });

  // ---- Редактирование ковров по отдельности ----
  const editCarpetsList = document.getElementById('editCarpetsList');
  const editPriceNormal = document.getElementById('editPriceNormal');
  const editPriceSmell = document.getElementById('editPriceSmell');
  const editCost = document.getElementById('editCost');
  let editCostManual = false;
  editCost.addEventListener('input', ()=>editCostManual=true);

  function editCarpetRow(value, type){
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;';
    row.innerHTML = `
      <span style="min-width:78px;color:var(--muted);font-size:13px;" data-carpet-label></span>
      <input type="number" step="0.01" min="0" class="edit-carpet-area" placeholder="м²" style="flex:1;min-width:80px;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;">
      <select class="edit-carpet-type" style="flex:1;min-width:140px;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;">
        <option value="normal">Обычный</option>
        <option value="smell">С сильным запахом</option>
      </select>
      <button type="button" class="btn btn-ghost btn-sm" data-remove-carpet style="width:auto;padding:8px 12px;">✕</button>`;
    if(value!==undefined) row.querySelector('.edit-carpet-area').value = value;
    if(type) row.querySelector('.edit-carpet-type').value = type;
    row.querySelector('.edit-carpet-area').addEventListener('input', editRecalc);
    row.querySelector('.edit-carpet-type').addEventListener('change', editRecalc);
    row.querySelector('[data-remove-carpet]').addEventListener('click', ()=>{
      if(editCarpetsList.children.length <= 1) return;
      row.remove();
      editRenumber();
      editRecalc();
    });
    return row;
  }
  function editRenumber(){
    [...editCarpetsList.children].forEach((row,i)=>{ row.querySelector('[data-carpet-label]').textContent = `Ковёр ${i+1}`; });
  }
  function editGetCarpets(){
    return [...editCarpetsList.children].map(row=>({
      area: parseFloat(row.querySelector('.edit-carpet-area').value),
      type: row.querySelector('.edit-carpet-type').value
    })).filter(x=>!isNaN(x.area) && x.area>0);
  }
  function editRecalc(){
    const data = editGetCarpets();
    const totalArea = data.reduce((s,x)=>s+x.area,0);
    document.getElementById('editCarpetsCountLabel').textContent = editCarpetsList.children.length;
    document.getElementById('editTotalAreaLabel').textContent = totalArea.toFixed(2).replace(/\.00$/,'') + ' м²';
    const pn = parseFloat(editPriceNormal.value)||0, ps = parseFloat(editPriceSmell.value)||0;
    const totalCost = data.reduce((s,x)=> s + x.area*(x.type==='smell'?ps:pn), 0);
    if(totalArea>0 && !editCostManual) editCost.value = Math.round(totalCost);
  }

  // Заполняем стартовые строки: делим текущую общую площадь поровну между известным кол-вом ковров
  const startQty = c.qty_carpets || 1;
  const startArea = c.area ? (parseFloat(c.area) / startQty) : '';
  for(let i=0;i<startQty;i++){ editCarpetsList.appendChild(editCarpetRow(startArea ? Math.round(startArea*100)/100 : undefined)); }
  editRenumber();
  document.getElementById('editAddCarpetBtn').addEventListener('click', ()=>{
    editCarpetsList.appendChild(editCarpetRow());
    editRenumber();
    editRecalc();
  });
  editPriceNormal.addEventListener('input', editRecalc);
  editPriceSmell.addEventListener('input', editRecalc);

  document.getElementById('applyDiscountBtn').addEventListener('click', ()=>{
    const discount = document.getElementById('editDiscount').value;
    const editCostEl = document.getElementById('editCost');
    const raw = parseFloat(editCostEl.value) || 0;
    const qty = editCarpetsList.children.length || 1;
    let discounted = raw, label = '';
    if(discount === 'pension'){
      discounted = raw * 0.9;
      label = 'Пенсионная скидка 10%';
    } else if(discount === 'promo3plus1'){
      const freeCount = Math.floor(qty / 4);
      if(freeCount > 0){
        const perCarpet = raw / qty;
        discounted = raw - perCarpet * freeCount;
        label = `Акция 3+1: бесплатно ${freeCount} ковёр(ов)`;
      } else {
        showToast('Для акции 3+1 нужно минимум 4 ковра в этом договоре');
        return;
      }
    } else {
      showToast('Выберите скидку из списка');
      return;
    }
    editCost.value = Math.round(discounted);
    const commentEl = document.getElementById('editComment');
    commentEl.value = [label, commentEl.value].filter(Boolean).join(' | ');
    showToast('Скидка применена — не забудьте нажать "Сохранить изменения"');
  });
  document.getElementById('saveDetailBtn').addEventListener('click', async ()=>{
    const cityVal = document.getElementById('editCity').value==='__other'
      ? document.getElementById('editCityOther').value.trim()
      : document.getElementById('editCity').value;
    const carpetsData = editGetCarpets();
    const totalArea = carpetsData.reduce((s,x)=>s+x.area,0);
    try{
      await api(`/api/contracts/${c.id}`, {method:'PATCH', body: JSON.stringify({
        city: cityVal,
        address: document.getElementById('editAddr').value.trim(),
        entrance: document.getElementById('editEntrance').value,
        floor: document.getElementById('editFloor').value,
        apartment: document.getElementById('editApt').value,
        qty_carpets: editCarpetsList.children.length,
        area: totalArea || null,
        price_per_m2: editPriceNormal.value || null,
        status: document.getElementById('editStatus').value,
        assigned_courier_id: document.getElementById('editCourier').value || null,
        cost: document.getElementById('editCost').value,
        comment: document.getElementById('editComment').value
      })});
      showToast('Изменения сохранены');
      closeDetail(); await loadContracts();
    }catch(e){ showToast(e.message); }
  });
  document.getElementById('deleteBtn').addEventListener('click', async ()=>{
    if(!confirm('Удалить этот договор?')) return;
    try{ await api(`/api/contracts/${c.id}`, {method:'DELETE'}); showToast('Договор удалён'); closeDetail(); await loadContracts(); }
    catch(e){ showToast(e.message); }
  });
}
function closeDetail(){ document.getElementById('detailOverlay').style.display='none'; document.getElementById('detailOverlay').innerHTML=''; }

// ---------- Client card ----------
async function loadClients(){
  const q = document.getElementById('clientSearch').value.trim();
  try{
    const clients = await api('/api/clients' + (q?`?q=${encodeURIComponent(q)}`:''));
    renderClients(clients);
  }catch(e){ showToast(e.message); }
}
function renderClients(clients){
  const el = document.getElementById('clientsContainer');
  if(clients.length===0){ el.innerHTML = `<div class="empty"><div class="big">👤</div><div class="t">Клиенты не найдены</div></div>`; return; }
  el.innerHTML = `<div class="list">${clients.map(cl=>`
    <div class="item" data-cid="${cl.id}">
      <div class="row1"><div><div class="phone">${escapeHtml(cl.phone)}</div>
      <div class="addr">${escapeHtml(cl.name||'Имя не указано')}</div></div></div>
      <div class="row2"><span>Договоров: <b>${cl.contracts_count}</b></span><span>Первое обращение: <b>${fmtDate(cl.first_contact)}</b></span></div>
      <div class="row3"><span class="cost">${fmtMoney(cl.total_spent)}</span><span class="date">${fmtDate(cl.last_update)}</span></div>
    </div>`).join('')}</div>`;
  el.querySelectorAll('[data-cid]').forEach(node=>node.addEventListener('click', ()=>openClientCard(node.dataset.cid)));
}
async function openClientCard(id){
  try{
    const client = await api(`/api/clients/${id}`);
    const overlay = document.getElementById('detailOverlay');
    overlay.style.display='flex';
    overlay.innerHTML = `<div class="sheet">
      <div class="sheet-head"><h2>${escapeHtml(client.phone)}</h2><button class="close-x" id="closeDetail">✕</button></div>
      <p class="formhint">${escapeHtml(client.name||'Имя не указано')} · Первое обращение: ${fmtDate(client.first_contact)}</p>
      <div class="list">${client.contracts.map(cardHtml).join('') || '<div class="empty">Нет договоров</div>'}</div>
      <button class="btn btn-ghost" id="deleteClientBtn" style="margin-top:16px;">Удалить клиента</button>
    </div>`;
    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    document.getElementById('deleteClientBtn').addEventListener('click', async ()=>{
      if(!confirm('Удалить этого клиента? Договоры останутся, но перестанут быть привязаны к клиенту.')) return;
      try{
        await api(`/api/clients/${id}`, {method:'DELETE'});
        showToast('Клиент удалён');
        closeDetail();
        await loadClients();
      }catch(err){ showToast(err.message); }
    });
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetail(); });
  }catch(e){ showToast(e.message); }
}

// ---------- Cash ----------
async function loadCash(){
  try{
    const data = await api('/api/contracts/cash-summary');
    renderCash(data);
  }catch(e){ showToast(e.message); }
}
function renderCash(data){
  const el = document.getElementById('cashStats');
  const paymentLabels = {cash:'Наличными', card:'Картой', 'не указано':'Не указано'};
  el.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="n">${fmtMoney(data.total)}</div><div class="l">Всего заработано (закрытые договоры)</div></div>
      <div class="stat"><div class="n">${data.count}</div><div class="l">Закрытых договоров</div></div>
    </div>
    ${data.byPayment ? `<div class="stat-row">
      ${data.byPayment.map(p=>`
        <div class="stat"><div class="n">${fmtMoney(p.total)}</div>
        <div class="l">${paymentLabels[p.method]||p.method} (${p.count})</div></div>`).join('')}
    </div>` : ''}
    <div class="card">
      <h1 class="formtitle">По дням</h1>
      <div class="list">${data.byDay.map(d=>`
        <div class="item" style="cursor:default;">
          <div class="row1"><div class="phone">${fmtDate(d.day)}</div>
          <span class="badge" style="background:var(--teal)">${d.count} дог.</span></div>
          <div class="row3"><span class="cost">${fmtMoney(d.total)}</span></div>
        </div>`).join('') || '<div class="empty">Пока нет закрытых договоров</div>'}
      </div>
    </div>`;
}

// ---------- Staff ----------
async function loadStaff(){
  try{
    const staff = await api('/api/users');
    couriers = staff.filter(u=>u.role==='courier' && u.is_active);
    const sel = document.getElementById('f_courier');
    sel.innerHTML = '<option value="">Не назначен</option>' + couriers.map(u=>`<option value="${u.id}">${escapeHtml(u.full_name)}</option>`).join('');
    window.__staff = staff;
    renderStaff();
  }catch(e){ showToast(e.message); }
}
function renderStaff(){
  const staff = window.__staff || [];
  const el = document.getElementById('staffContainer');
  el.innerHTML = `<div class="list">${staff.map(u=>`
    <div class="item" style="cursor:default;">
      <div class="row1"><div><div class="phone">${escapeHtml(u.full_name)}</div>
      <div class="addr">${escapeHtml(u.email)}${u.phone?' · '+escapeHtml(u.phone):''}</div></div>
      <span class="badge" style="background:${u.role==='admin'?'var(--teal)':'var(--status-pickup)'}">${u.role==='admin'?'Админ':'Курьер'}</span></div>
      <div class="row3">
        <span class="date">${u.is_active?'Активен':'Отключён'}</span>
        <button class="btn btn-sm ${u.is_active?'btn-ghost':'btn-primary'}" data-toggle="${u.id}" data-active="${u.is_active}">
          ${u.is_active?'Отключить':'Включить'}</button>
      </div>
    </div>`).join('')}</div>`;
  el.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        await api(`/api/users/${btn.dataset.toggle}`, {method:'PATCH', body: JSON.stringify({is_active: btn.dataset.active!=='true'})});
        showToast('Обновлено'); await loadStaff();
      }catch(e){ showToast(e.message); }
    });
  });
}
function wireStaffForm(){
  document.getElementById('addStaffBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('s_email').value.trim();
    const password = document.getElementById('s_password').value;
    const role = document.getElementById('s_role').value;
    const full_name = document.getElementById('s_name').value.trim();
    const phone = document.getElementById('s_phone').value.trim();
    if(!email||!password||!full_name){ showToast('Заполните имя, email и пароль'); return; }
    try{
      await api('/api/users', {method:'POST', body: JSON.stringify({email,password,role,full_name,phone})});
      showToast('Сотрудник добавлен');
      ['s_name','s_email','s_password','s_phone'].forEach(id=>document.getElementById(id).value='');
      await loadStaff();
    }catch(e){ showToast(e.message); }
  });
}

init();
</script>
</body>
</html>
